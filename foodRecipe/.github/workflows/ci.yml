name: CI Pipeline - FoodRecipe

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: foodRecipe/backend
        run: npm install

      - name: Run lint
        working-directory: foodRecipe/backend
        run: npx eslint . --ext .js || true

      - name: Build Docker image backend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/foodrecipe-backend:${{ github.sha }} ./foodRecipe/backend
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/foodrecipe-backend:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/foodrecipe-backend:latest

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image backend
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/foodrecipe-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/foodrecipe-backend:latest

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: foodRecipe/frontend/food-blog-app
        run: npm install

      - name: Run lint
        working-directory: foodRecipe/frontend/food-blog-app
        run: npm run lint || true

      - name: Build Docker image frontend
        run: |
          docker build \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/foodrecipe-frontend:${{ github.sha }} \
            ./foodRecipe/frontend/food-blog-app
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/foodrecipe-frontend:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/foodrecipe-frontend:latest

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image frontend
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/foodrecipe-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/foodrecipe-frontend:latest